name: enotes_app
description: A private notes app for Android and web.
publish_to: "none"
version: 1.0.0+1

environment:
  # Flutter 3.35.7 ships Dart 3.9.2; keep this in sync with the CI toolchain.
  sdk: ^3.9.0

dependencies:
  # 11.0.3 is the last release that supports Flutter < 3.38 (12.x requires 3.38).
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  http: ^1.3.0
  shared_preferences: ^2.5.0
  # 6.3.3 requires Dart ^3.11; 6.3.2 is the newest that works on Dart 3.9 (Flutter 3.35).
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
